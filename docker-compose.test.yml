# Throwaway services for the integration suite.
#
#   npm run redis:test:up
#   npm run test:integration
#   npm run redis:test:down
#
# Deliberately published on non-default ports so a running development stack is
# never the thing the tests wipe. Phase 7 adds a PostgreSQL service here.
#
# Its own project name, for the same reason in the other direction: both files
# would otherwise default to the directory name, and `npm run down` on the
# development stack would take the test services with it.
name: karobakbak-test

services:
  redis-test:
    image: redis:7-alpine
    container_name: karobakbak-redis-test
    # Same flags as production (D12): no RDB snapshots, no AOF. Live state is
    # reconstructible, and disabling persistence is what guarantees no Redis
    # structure - including a Pub/Sub payload carrying message text - reaches
    # disk. The tests therefore exercise the same durability semantics as prod.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /data

  postgres-test:
    image: postgres:16-alpine
    container_name: karobakbak-postgres-test
    environment:
      POSTGRES_USER: karobakbak
      POSTGRES_PASSWORD: karobakbak
      POSTGRES_DB: karobakbak_test
      # Throwaway data on a throwaway service: fsync off makes the suite
      # noticeably faster and risks nothing that matters.
      POSTGRES_INITDB_ARGS: "--nosync"
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "synchronous_commit=off"]
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karobakbak -d karobakbak_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
