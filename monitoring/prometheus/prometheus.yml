# Scrapes both backends directly on the private network, not through nginx.
# nginx returns 404 for /metrics on purpose: the scrape is for this service,
# not for the internet.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: karobakbak-backend
    metrics_path: /metrics
    static_configs:
      # Both instances. Every series already carries an `instance` label from
      # the application, so a metric can be read per-process or summed.
      - targets: ["backend:8080", "backend-2:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
