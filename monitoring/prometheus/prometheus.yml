# Scrapes every backend replica directly on the private network, not through
# nginx. nginx returns 404 for /metrics on purpose: the scrape is for this
# service, not for the internet.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  # Unit economics. Evaluated once here rather than repeated in every panel,
  # so the price model and the usage it multiplies cannot disagree between two
  # dashboards.
  - /etc/prometheus/cost.rules.yml

# Where a firing rule goes.
#
# Without this block every rule in `alerts.yml` evaluated, turned red in this
# server's own web UI, and notified nobody — including the two labelled
# `severity: page`. Rules that reach no one are not monitoring; they are a
# dashboard that looks finished.
#
# Discovered by DNS for the same reason the backends are: the service name is
# the membership list, and a container replaced later keeps working without a
# config change.
alerting:
  alertmanagers:
    - dns_sd_configs:
        - names: ["alertmanager"]
          type: A
          port: 9093
          refresh_interval: 30s

scrape_configs:
  - job_name: karobakbak-backend
    metrics_path: /metrics
    # ---------------------------------------------------------------------
    # DNS DISCOVERY, NOT A STATIC LIST
    # ---------------------------------------------------------------------
    # The backends are replicas of one compose service, so they share the name
    # `backend` and Docker's embedded DNS returns an A record per container. A
    # static target of `backend:8080` would resolve to whichever replica the DNS
    # round-robin happened to answer with and scrape only that one — the other
    # instance would silently contribute nothing, which is the worst kind of
    # monitoring gap: the dashboard looks fine and is describing half the
    # system.
    #
    # DNS discovery follows `--scale backend=N` with no config change, which is
    # the point of scaling rather than hand-listing instances.
    #
    # Every series already carries an `instance` label from the application
    # itself, so a metric can be read per-process or summed regardless of what
    # the target list looks like.
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8080
        refresh_interval: 15s

# ---------------------------------------------------------------------------
# WHAT IS NOT STORED, AND WHY THE LIST IS THIS SHORT
# ---------------------------------------------------------------------------
# Applied to the two application jobs below. It drops sixty series per instance
# that nothing in this repository has ever read: V8 heap-space breakdowns, GC
# duration buckets, and the per-type handle and resource counts.
#
# The `_total` counterparts of the handle and resource gauges are kept, and so
# are `_sum` and `_count` for GC — so "is garbage collection getting worse" is
# still answerable. What goes is the per-space and per-percentile detail, which
# would only ever be read by somebody debugging V8 itself.
#
# ---------------------------------------------------------------------------
# WHY PERSONA AND PREFERENCE SERIES ARE **NOT** DROPPED
# ---------------------------------------------------------------------------
# They are the obvious next cut: personas are off and `FILTERS_ENABLED` is
# false in production, so 56 series sit at zero. Dropping them would save more
# than everything above.
#
# It is not done, because **nine of them are referenced by alert rules**. A drop
# rule here would work perfectly while the features are off and would silently
# disable eight persona alerts and the preference ones on the day somebody
# turns them on — a metric that is absent looks exactly like a metric that is
# quiet, which is the failure this whole file exists to avoid. A zero-valued
# series is cheap; an alert that stopped evaluating and told nobody is not.
#
# If that trade is ever worth making, the drop belongs beside a check that
# fails when an alerted metric is on the drop list. Not before.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'chat_process_nodejs_(heap_space_size_[a-z]+_bytes|gc_duration_seconds_bucket|active_handles|active_resources)'
        action: drop


  - job_name: karobakbak-personas
    metrics_path: /metrics
    # ---------------------------------------------------------------------
    # ITS OWN JOB, AND ALLOWED TO BE ABSENT
    # ---------------------------------------------------------------------
    # The persona service is optional and off by default (DESIGN.md, D-AI-*),
    # so this target is down on most deployments. That is correct rather than a
    # gap: a deployment with no personas has nothing to report, and every
    # chat_persona_* alert is written to stay quiet when the series are absent.
    #
    # A static target rather than DNS discovery, because there is exactly one of
    # these — a second would double-dispatch against the same queue.
    static_configs:
      - targets: ["personas:8090"]

    # The same drop list as the backend job. The persona process runs the same
    # default collector and produces the same sixty series of V8 internals.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'chat_process_nodejs_(heap_space_size_[a-z]+_bytes|gc_duration_seconds_bucket|active_handles|active_resources)'
        action: drop

  # ---------------------------------------------------------------------------
  # THE COST DECK'S MULTIPLICANDS
  # ---------------------------------------------------------------------------
  # These three answer "what is the infrastructure doing"; the application
  # publishes "what does it cost" as `chat_cost_unit_price_micro_cents`, and
  # `cost.rules.yml` multiplies them. None is on a request path, so all three
  # are allowed to be down without anything else being wrong.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The notifier is scraped too, because a notifier that is down is
  # indistinguishable from a quiet night. `AlertmanagerAbsent` in `alerts.yml`
  # is the rule that would otherwise have no data to fire on.
  - job_name: alertmanager
    dns_sd_configs:
      - names: ["alertmanager"]
        type: A
        port: 9093
        refresh_interval: 30s
