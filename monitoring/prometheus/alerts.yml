# The alerts that matter, and why each one is worth waking somebody for.
#
# Deliberately short. An alert nobody acts on trains people to ignore the ones
# they should, so everything here is either "users are affected" or "a promise
# the product made is silently not being kept".

groups:
  - name: karobakbak
    rules:
      - alert: BackendDown
        expr: up{job="karobakbak-backend"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "A backend instance is not being scraped"

      # The rule above only fires for a target that is *discovered and failing*.
      # Targets come from Docker DNS, which stops answering for a container that
      # has crashed or been killed — so the instance leaves the target list, its
      # `up` series goes stale, and `up == 0` matches nothing at all. Production
      # runs a single replica, so the likeliest outage there is the one the rule
      # above cannot see: the whole job disappearing. This is that alert.
      - alert: BackendAbsent
        expr: absent(up{job="karobakbak-backend"})
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "No backend instance is being discovered at all"
          description: >-
            Prometheus has no target for the backend job. A crashed or stopped
            container leaves DNS discovery, which looks quieter than a healthy
            system rather than louder. Every user is affected.

      # ---------------------------------------------------------------------
      # THE TWO RULES THAT WATCH THE WATCHER
      # ---------------------------------------------------------------------
      # Every other rule here assumes notifications work. These two are what
      # make that assumption checkable, and both failure modes are silent:
      # a notifier that is gone, and a notifier that is running and posting to
      # a URL that rejects it.
      - alert: AlertmanagerAbsent
        expr: absent(up{job="alertmanager"}) or up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Alerts have nowhere to go"
          description: >-
            Prometheus cannot reach Alertmanager, so every other rule in this
            file is evaluating into nothing. Until this clears, silence from
            the monitoring means nothing at all.

      - alert: AlertNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Alertmanager cannot deliver notifications"
          description: >-
            The receiver is rejecting or unreachable — most often a webhook URL
            that is wrong, expired, or rate limiting. This is the failure that
            looks exactly like a quiet week, and it is the first thing to
            suspect after changing the URL.

      # The number that proves expiry is enforced rather than attempted. A worker
      # falling behind still deletes steadily, so `chat_retention_deleted_total`
      # looks healthy either way; a backlog that stays above zero across passes
      # does not. Generous `for`, because a pass legitimately leaves rows behind
      # between runs — what matters is whether it clears them.
      - alert: RetentionBacklogGrowing
        expr: sum(chat_retention_backlog) > 0
        for: 2h
        labels:
          severity: ticket
        annotations:
          summary: "Data past its deletion deadline is still stored"
          description: >-
            Rows have been past their retention deadline for two hours without
            being collected. Either the worker is not keeping up with volume or
            it is not running. This is the promise the landing page makes, and
            nothing else in the system notices when it stops being true.

      - alert: RetentionDeletionFailing
        expr: increase(chat_deletion_failures_total[1h]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The deletion worker is failing"
          description: >-
            Data past its retention deadline is still stored. This is a promise
            the product made to its users that is not being kept (I10), and
            nothing else in the system will notice.

      - alert: SafetyRecordsDropped
        expr: increase(chat_retention_dropped_total{class="p0"}[15m]) > 0
        labels:
          severity: page
        annotations:
          summary: "Safety evidence is being dropped"
          description: >-
            P0 covers reports, moderation events and enforcement actions.
            Reaching its capacity requires a sustained database outage and a
            report flood at once (§14.3).

      # Compared against the target the application exports rather than a number
      # copied into this file. A threshold repeated in two places drifts the
      # moment somebody tunes one of them, which is how an alert quietly stops
      # meaning what its name says (the same mistake `SpoolNearCapacity` still
      # makes with its hardcoded 40000).
      - alert: ReportsWaitingTooLong
        expr: chat_report_queue_oldest_seconds > chat_report_response_target_seconds
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Somebody asked for help and is still waiting"
          description: >-
            The oldest untriaged report has been open longer than the configured
            response target. A report is a person saying something went wrong;
            with a single moderator there is no rota to notice this, which is
            why it pages rather than waits for somebody to open the console.

      - alert: DatabaseCircuitOpen
        expr: chat_db_breaker_state == 2
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The retention circuit breaker is open"
          description: >-
            Chat is unaffected by design (D16); retention is degraded and
            records are going to the outage spool, which is bounded and is not
            durable storage (D28).

      # Ratios against the limits the application exports, not copied numbers.
      # This fired at a hardcoded 40000 — 80% of the *default* record ceiling
      # and unreachable on any deployment that lowered it. The spool would fill
      # and start dropping while the rule watched a threshold nothing could
      # reach. The byte ceiling had no rule at all, and a workload with larger
      # records reaches that one first.
      - alert: SpoolNearCapacity
        expr: chat_spool_records / chat_spool_max_records > 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "The outage spool is filling"
          description: "Records are dropped once it is full, oldest policy first."

      - alert: SpoolNearByteCapacity
        expr: chat_spool_bytes / chat_spool_max_bytes > 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "The outage spool is filling by size"
          description: >-
            The spool is bounded by bytes as well as by record count, and a
            workload with larger records reaches this ceiling first.

      # `> 0` is load-bearing, and was found by running this stack rather than
      # by reading it. `chat_backup_last_success_timestamp` is an unlabelled
      # gauge, and `prom-client` emits those at zero from the moment they are
      # registered — so `time() - 0` is always enormous and this rule went
      # pending on a completely healthy, freshly started deployment. An alert
      # that is red on day one for a reason unrelated to its subject is how an
      # operator learns to ignore the alert that matters.
      #
      # Guarding it means "never backed up at all" is no longer covered here,
      # so the rule below covers it explicitly — which is the better shape
      # anyway: the two states have different causes and different fixes.
      - alert: BackupsStale
        expr: chat_backup_last_success_timestamp > 0
          and time() - chat_backup_last_success_timestamp > chat_backup_max_age_seconds
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "No successful backup observed within the window"
          description: >-
            Backups were running and have stopped. An unmonitored backup is
            indistinguishable from no backup until the restore (§8.1).

      - alert: BackupsNeverObserved
        expr: chat_backup_last_success_timestamp == 0
          and time() - chat_process_process_start_time_seconds > chat_backup_max_age_seconds
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "This instance has never seen a backup succeed"
          description: >-
            The process has been up longer than the backup window and has still
            never been told a backup completed. Either nothing is taking them,
            or whatever takes them is not reporting back. Both mean there is
            nothing to restore from.

      - alert: EventLoopLagHigh
        expr: chat_process_nodejs_eventloop_lag_p99_seconds > 0.25
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Event-loop lag is high"
          description: "Every socket on this instance is feeling it."
