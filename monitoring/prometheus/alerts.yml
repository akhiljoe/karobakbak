# The alerts that matter, and why each one is worth waking somebody for.
#
# Deliberately short. An alert nobody acts on trains people to ignore the ones
# they should, so everything here is either "users are affected" or "a promise
# the product made is silently not being kept".

groups:
  - name: karobakbak
    rules:
      - alert: BackendDown
        expr: up{job="karobakbak-backend"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "A backend instance is not being scraped"

      # The rule above only fires for a target that is *discovered and failing*.
      # Targets come from Docker DNS, which stops answering for a container that
      # has crashed or been killed — so the instance leaves the target list, its
      # `up` series goes stale, and `up == 0` matches nothing at all. Production
      # runs a single replica, so the likeliest outage there is the one the rule
      # above cannot see: the whole job disappearing. This is that alert.
      - alert: BackendAbsent
        expr: absent(up{job="karobakbak-backend"})
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "No backend instance is being discovered at all"
          description: >-
            Prometheus has no target for the backend job. A crashed or stopped
            container leaves DNS discovery, which looks quieter than a healthy
            system rather than louder. Every user is affected.

      # ---------------------------------------------------------------------
      # THE TWO RULES THAT WATCH THE WATCHER
      # ---------------------------------------------------------------------
      # Every other rule here assumes notifications work. These two are what
      # make that assumption checkable, and both failure modes are silent:
      # a notifier that is gone, and a notifier that is running and posting to
      # a URL that rejects it.
      - alert: AlertmanagerAbsent
        expr: absent(up{job="alertmanager"}) or up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Alerts have nowhere to go"
          description: >-
            Prometheus cannot reach Alertmanager, so every other rule in this
            file is evaluating into nothing. Until this clears, silence from
            the monitoring means nothing at all.

      - alert: AlertNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Alertmanager cannot deliver notifications"
          description: >-
            The receiver is rejecting or unreachable — most often a webhook URL
            that is wrong, expired, or rate limiting. This is the failure that
            looks exactly like a quiet week, and it is the first thing to
            suspect after changing the URL.

      # The number that proves expiry is enforced rather than attempted. A worker
      # falling behind still deletes steadily, so `chat_retention_deleted_total`
      # looks healthy either way; a backlog that stays above zero across passes
      # does not. Generous `for`, because a pass legitimately leaves rows behind
      # between runs — what matters is whether it clears them.
      - alert: RetentionBacklogGrowing
        expr: sum(chat_retention_backlog) > 0
        for: 2h
        labels:
          severity: ticket
        annotations:
          summary: "Data past its deletion deadline is still stored"
          description: >-
            Rows have been past their retention deadline for two hours without
            being collected. Either the worker is not keeping up with volume or
            it is not running. This is the promise the landing page makes, and
            nothing else in the system notices when it stops being true.

      - alert: RetentionDeletionFailing
        expr: increase(chat_deletion_failures_total[1h]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The deletion worker is failing"
          description: >-
            Data past its retention deadline is still stored. This is a promise
            the product made to its users that is not being kept (I10), and
            nothing else in the system will notice.

      - alert: SafetyRecordsDropped
        expr: increase(chat_retention_dropped_total{class="p0"}[15m]) > 0
        labels:
          severity: page
        annotations:
          summary: "Safety evidence is being dropped"
          description: >-
            P0 covers reports, moderation events and enforcement actions.
            Reaching its capacity requires a sustained database outage and a
            report flood at once (§14.3).

      # Compared against the target the application exports rather than a number
      # copied into this file. A threshold repeated in two places drifts the
      # moment somebody tunes one of them, which is how an alert quietly stops
      # meaning what its name says (the same mistake `SpoolNearCapacity` still
      # makes with its hardcoded 40000).
      - alert: ReportsWaitingTooLong
        expr: chat_report_queue_oldest_seconds > chat_report_response_target_seconds
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Somebody asked for help and is still waiting"
          description: >-
            The oldest untriaged report has been open longer than the configured
            response target. A report is a person saying something went wrong;
            with a single moderator there is no rota to notice this, which is
            why it pages rather than waits for somebody to open the console.

      - alert: DatabaseCircuitOpen
        expr: chat_db_breaker_state == 2
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The retention circuit breaker is open"
          description: >-
            Chat is unaffected by design (D16); retention is degraded and
            records are going to the outage spool, which is bounded and is not
            durable storage (D28).

      # Ratios against the limits the application exports, not copied numbers.
      # This fired at a hardcoded 40000 — 80% of the *default* record ceiling
      # and unreachable on any deployment that lowered it. The spool would fill
      # and start dropping while the rule watched a threshold nothing could
      # reach. The byte ceiling had no rule at all, and a workload with larger
      # records reaches that one first.
      - alert: SpoolNearCapacity
        expr: chat_spool_records / chat_spool_max_records > 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "The outage spool is filling"
          description: "Records are dropped once it is full, oldest policy first."

      - alert: SpoolNearByteCapacity
        expr: chat_spool_bytes / chat_spool_max_bytes > 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "The outage spool is filling by size"
          description: >-
            The spool is bounded by bytes as well as by record count, and a
            workload with larger records reaches this ceiling first.

      # `> 0` is load-bearing, and was found by running this stack rather than
      # by reading it. `chat_backup_last_success_timestamp` is an unlabelled
      # gauge, and `prom-client` emits those at zero from the moment they are
      # registered — so `time() - 0` is always enormous and this rule went
      # pending on a completely healthy, freshly started deployment. An alert
      # that is red on day one for a reason unrelated to its subject is how an
      # operator learns to ignore the alert that matters.
      #
      # Guarding it means "never backed up at all" is no longer covered here,
      # so the rule below covers it explicitly — which is the better shape
      # anyway: the two states have different causes and different fixes.
      - alert: BackupsStale
        expr: chat_backup_last_success_timestamp > 0
          and time() - chat_backup_last_success_timestamp > chat_backup_max_age_seconds
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "No successful backup observed within the window"
          description: >-
            Backups were running and have stopped. An unmonitored backup is
            indistinguishable from no backup until the restore (§8.1).

      - alert: BackupsNeverObserved
        expr: chat_backup_last_success_timestamp == 0
          and time() - chat_process_process_start_time_seconds > chat_backup_max_age_seconds
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "This instance has never seen a backup succeed"
          description: >-
            The process has been up longer than the backup window and has still
            never been told a backup completed. Either nothing is taking them,
            or whatever takes them is not reporting back. Both mean there is
            nothing to restore from.

      - alert: EventLoopLagHigh
        expr: chat_process_nodejs_eventloop_lag_p99_seconds > 0.25
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Event-loop lag is high"
          description: "Every socket on this instance is feeling it."

      # ----------------------------------------------------------------------
      # AI personas (D-AI-8)
      # ----------------------------------------------------------------------
      # None of these reads message content, and none can: every series they
      # touch carries counts and enum labels only. What a persona said is read
      # in the console, audited (D-AI-12).

      - alert: PersonaCrisisHandled
        expr: increase(chat_persona_limit_trips_total{limit="crisis"}[15m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "A persona broke character for a self-harm signal"
          description: >-
            Somebody told an automated account they were in crisis. The persona
            dropped character and gave helpline numbers, which is what it is
            built to do — this fires because a person should know it happened,
            not because anything is broken. The session is flagged for review.

      - alert: PersonaMinorSignal
        expr: increase(chat_persona_limit_trips_total{limit="minor"}[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "A persona conversation showed a minor signal"
          description: >-
            The romantic register was locked irreversibly for that session and
            the session was flagged. Sustained volume here is a review trigger
            for the age-assurance decision in minor-safety-policy.md §3, which
            is the whole reason this counter exists.

      - alert: PersonaBudgetNearCeiling
        expr: >-
          chat_persona_budget_remaining_micro_cents > 0
          and chat_persona_budget_remaining_micro_cents
              < 0.2 * (chat_persona_budget_remaining_micro_cents
                       + sum without(provider, model) (chat_persona_cost_micro_cents_total))
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Persona spend is within 20% of the monthly ceiling"
          description: >-
            Personas stop joining at the ceiling and live conversations finish.
            Nothing breaks; the product carries on with humans only. This is
            notice, so the ceiling is a decision rather than a surprise.

      - alert: PersonaBudgetExhausted
        expr: increase(chat_persona_budget_exhausted_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "The persona spend ceiling has been reached"
          description: >-
            Model calls are refused and personas fall back to the scripted
            voice. Raise PERSONA_MONTHLY_LIMIT_MICRO_CENTS deliberately or leave
            it, but do not discover this on an invoice.

      - alert: PersonaEnabledWhileExhausted
        expr: >-
          chat_persona_sessions_active > 0
          and chat_persona_budget_remaining_micro_cents == 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Personas are running with no budget left"
          description: >-
            This should be impossible: the budget check runs before every model
            call and fails closed. Personas still holding conversations long
            after the ceiling means either the fallback voice is carrying them,
            which is fine, or the check is not binding, which is not. Worth
            looking at rather than assuming.

      - alert: PersonaProviderFailing
        expr: >-
          sum without(model) (rate(chat_persona_provider_requests_total{outcome="error"}[10m]))
          > 0.2 * sum without(model, outcome) (rate(chat_persona_provider_requests_total[10m]))
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "More than a fifth of model calls are failing"
          description: >-
            Personas fall back to the scripted voice rather than going silent,
            so users see a duller conversation and not a broken one. Check the
            vendor before assuming it is us; the per-provider control lever
            exists for exactly this.

      - alert: PersonaFillPolicyStalled
        expr: >-
          increase(chat_persona_fill_dispatched_total[6h]) == 0
          and increase(chat_persona_fill_suppressed_total{reason="queue_unreadable"}[6h]) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Personas have dispatched nothing and cannot read the queue"
          description: >-
            The fill policy refuses to dispatch when it cannot see how many
            humans are waiting, which is correct — dispatching into an unknown
            queue is what it exists to prevent. But a policy that has been blind
            for six hours is not filling anything, and nothing else reports it.

      - alert: PersonaNeverCachingPrefix
        expr: >-
          increase(chat_persona_tokens_total{kind="cache_read"}[1h]) == 0
          and increase(chat_persona_tokens_total{kind="input"}[1h]) > 100000
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Persona prompts are not hitting the prefix cache"
          description: >-
            Cache reads are a tenth of the input price, and the stable/volatile
            prompt split exists to earn them. Zero reads against real input
            volume means the split has broken — most likely something volatile
            moved before the cache breakpoint, or the stable prefix fell below
            the minimum cacheable size. There is no error for this; the bill is
            simply several times larger.

  # ---------------------------------------------------------------------------
  # PRODUCT AND COST (phase 28)
  # ---------------------------------------------------------------------------
  # These watch the two decks built in phases 26 and 27. Every one of them is
  # written to stay quiet when its series are absent, the same discipline the
  # persona rules already follow — a deployment with no traffic must not page.
  - name: karobakbak-product
    rules:
      # Safety evidence being lost under overload. D26 and D27 claim the queue
      # sheds P3 first and protects everything above it, and a 5,000-bot run
      # demonstrated exactly that: 2,657 records dropped, every one of them P3.
      # A P0 or P1 drop is that claim failing, and it is the most serious thing
      # any of these decks can show.
      - alert: SafetyEvidenceDropped
        expr: sum(increase(chat_retention_dropped_total{class=~"p0|p1"}[15m])) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Retention dropped a P0/P1 record — safety evidence is being lost"
          description: >-
            The write-behind queue is lossy under overflow by design (D16), but the
            priority classes exist so that ordinary chat is shed and evidence is not.
            Check chat_retention_queue_depth by class and the breaker state.

      # An under-18 declaration. Not a fault and deliberately not a page: it is a
      # safety signal the minor-safety work needs a count of, and a sudden change
      # in the rate is what is worth a human looking. The age gate remains the
      # whole of the enforcement (minor-safety-policy §3); this is not age
      # assurance and must never be described as such.
      - alert: AgeBelowMinimumDeclarations
        expr: sum(increase(chat_profiles_refused_total{reason="age_below_minimum"}[1h])) > 20
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Unusual number of declared ages below the minimum"
          description: >-
            Counted, never who and never what age. Worth reading alongside the
            moderation queue rather than acted on directly.

      # Sign-in is reaching the provider and not coming back. Distinguishes a
      # broken OIDC configuration from nobody being interested, which look
      # identical without it.
      - alert: SignInFailing
        expr: >-
          sum(increase(chat_auth_starts_total[30m])) > 10
          and
          sum(increase(chat_auth_callbacks_total{outcome="ok"}[30m]))
            / clamp_min(sum(increase(chat_auth_starts_total[30m])), 1) < 0.5
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Fewer than half of started sign-ins are completing"
          description: >-
            Read chat_auth_callbacks_total by outcome. `flow_mismatch` is login-CSRF
            prevention doing its job; `token_error` and `no_credential` are faults.

  # Named apart from the recording group in cost.rules.yml. Two rule groups may
  # share a name and Prometheus will load both, which makes a rule impossible to
  # locate from its group label alone.
  - name: karobakbak-cost-alerts
    rules:
      # ---------------------------------------------------------------------
      # ON RATE OF CHANGE, NEVER AN ABSOLUTE FIGURE (D56)
      # ---------------------------------------------------------------------
      # The same code runs on a laptop and on a production host with different
      # absolute costs and identical wrong-direction signals. An absolute
      # threshold would have to be re-tuned per environment, which means it
      # would be wrong in one of them.
      #
      # Both are gated on `chat_cost_model_configured` so an unpriced deployment
      # — which is the default, because a plausible default price would be
      # believed and wrong — never fires them.
      - alert: CostPerConversationRising
        expr: >-
          max(chat_cost_model_configured) == 1
          and
          kbb:cost_dollars_per_conversation
            > 3 * avg_over_time(kbb:cost_dollars_per_conversation[24h])
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Cost per conversation is 3x its own daily average"
          description: >-
            Usually the denominator rather than the bill: infrastructure that runs
            for nobody costs exactly what it costs, so a quiet period reports the
            whole hourly cost as the price of one conversation. Check the funnel
            before checking the spend.

      # Storage that grows without bound is D17 failing — deadlines are stamped
      # at insert, so the database should level off rather than climb for ever.
      - alert: StorageNotReachingSteadyState
        expr: kbb:storage_growth_bytes_per_day > 0 and kbb:disk_gb:used > 1
        for: 12h
        labels:
          severity: ticket
        annotations:
          summary: "Retained data has grown every hour for twelve hours"
          description: >-
            Check chat_retention_backlog. A deletion worker that has fallen behind
            still deletes steadily, so throughput looks healthy while the backlog
            grows — the backlog is the instrument, not the delete rate.

  # ---------------------------------------------------------------------------
  # THE FAILURE THAT REPORTS ITSELF HEALTHY (F-044)
  # ---------------------------------------------------------------------------
  # When Redis refuses writes — `maxmemory` reached under `noeviction` — this
  # service is completely non-functional and says it is fine. `/ready` is
  # derived from Redis *reachability*, and a PING succeeds under OOM because
  # only writes are refused. So every instance stays in the load balancer while
  # nobody can be matched at all.
  #
  # Measured: 60 bots connected, zero conversations, `/ready` reporting
  # `{"status":"ready","redis":"ready"}` throughout.
  #
  # `chat_connections_rejected_total{reason="error"}` is the one series that
  # moves. Nothing watched it.
  - name: karobakbak-redis-writes
    rules:
      - alert: SessionsFailingToOpen
        expr: sum(rate(chat_connections_rejected_total{reason="error"}[5m])) > 0.2
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Sessions are failing to open — Redis is probably refusing writes"
          description: >-
            /ready will still say ready: it is derived from Redis reachability and a
            PING succeeds when only writes are refused. Check `redis-cli info memory`
            against maxmemory, and `redis-cli set canary 1` for the OOM reply.

      # The precondition, watched directly. `noeviction` with no `maxmemory` is
      # inert: nothing is refused and nothing is evicted, so Redis grows until
      # the host OOM-killer takes it — and with persistence off (D12) that loses
      # every live session, match and block at once.
      - alert: RedisApproachingMaxMemory
        expr: >-
          redis_memory_max_bytes > 0
          and redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Redis is within 20% of maxmemory, and the policy is noeviction"
          description: >-
            Reaching it refuses every write, which stops matchmaking entirely while
            every health check continues to pass. Measured at roughly 2.6 KB of Redis
            per live session.

  # ---------------------------------------------------------------------------
  # THE TWO CLOCKS THAT DECIDE HOW LONG DATA IS KEPT
  # ---------------------------------------------------------------------------
  # `retention_expires_at` is stamped from the application's clock (D17) and
  # every deletion statement compares it against the database's `now()`. On one
  # host they are the same clock. On a managed database they are two machines,
  # and a skew moves every retention deadline by exactly that much — a process
  # running an hour fast keeps conversations an hour longer than the privacy
  # policy says, and nothing else would report it.
  #
  # Five minutes is far beyond anything NTP allows and far below anything that
  # would breach a thirty-day promise on its own. It is set to catch a clock
  # that has come loose, not to police jitter.
  - name: karobakbak-clock
    rules:
      - alert: ClockSkewAgainstDatabase
        expr: max(abs(chat_clock_skew_seconds)) > 300
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "This process's clock is more than five minutes from the database's"
          description: >-
            Retention deadlines are stamped from the application clock and checked
            against the database clock, so every deadline written while this persists
            is wrong by the skew. Check NTP on both hosts.

  # ---------------------------------------------------------------------------
  # Capacity
  # ---------------------------------------------------------------------------
  # The connection ceiling is derived per box (cores x CONNECTIONS_PER_CORE),
  # so these are written against the ratio and never against a literal count.
  # An alert with the number baked in would be wrong on every tier but one, and
  # wrong in the reassuring direction.
  #
  # Measured on 1 vCPU (docs/testing/RESULTS.md, 2026-09-02): the core saturates
  # around 2,000 concurrent, and latency is what degrades - ack p99 went 150ms
  # to 598ms between 1,000 and 2,000. Nothing errors, nothing restarts. So the
  # warning has to come from headroom, because the service does not report this
  # failure any other way.
  - name: karobakbak-capacity
    rules:
      - alert: ConnectionHeadroomLow
        expr: max(chat_connections_active / chat_connections_limit) > 0.7
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "An instance is holding over 70% of the connections it will accept"
          description: >-
            Not urgent, and not a fault. This is the point at which the next tier
            should be bought rather than the point at which anything breaks.
            Check the Capacity row on the overview dashboard: if the population
            is conversation-heavy, latency degrades before the ceiling binds.

      - alert: RefusingConnectionsAtCapacity
        expr: sum(rate(chat_connections_rejected_total{reason="at_capacity"}[5m])) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "People are being turned away — the connection ceiling is binding"
          description: >-
            Every refusal here is somebody who could not get in. Raising
            CONNECTIONS_PER_CORE is not automatically the fix: the ceiling exists
            to stop the box collapsing, and raising it past what the cores serve
            converts a refusal into latency for everybody already inside. Add a
            core, or accept the refusals deliberately as a cost ceiling.
