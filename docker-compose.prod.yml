# Production overrides.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (or: npm run prod:up)
#
# Naming `-f` explicitly is what stops development defaults leaking in.
#
# ---------------------------------------------------------------------------
# EVERY SECRET IS REQUIRED, NONE HAS A DEFAULT
# ---------------------------------------------------------------------------
# `${VAR:?message}` makes compose refuse to start when a variable is unset,
# with that message. This is the whole safety property of the file: a
# deployment that has not been configured fails loudly at `up`, rather than
# starting with the salt named `local-development-salt-change-me` and hashing
# every user's IP with a value published on GitHub.
#
# Fill these in from `.env.prod.example`. Keep the real file off the machine
# where possible — a secret manager injecting environment variables is better
# than a file, and both are better than this repository.
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE DOES NOT DO
# ---------------------------------------------------------------------------
# * **No secret manager.** Variables are read from the environment; where they
#   come from is the platform's business. (Repeated below; this list used to
#   also carry TLS and backups, both of which now exist.)
#
# ---------------------------------------------------------------------------
# ONE BACKEND
# ---------------------------------------------------------------------------
# Production starts at one (cost §26) and scales on measured resource pressure,
# not on user count. The second replica on a laptop exists to prove
# cross-instance correctness; it is not a capacity decision.
#
# Scaling up is `--scale backend=N` — every matchmaking transition is a single
# Lua script precisely so that works, and Prometheus discovers replicas by DNS
# rather than a hand-written target list.

services:
  # ---------------------------------------------------------------------------
  # TLS
  # ---------------------------------------------------------------------------
  # The only service that publishes to the world. Certificates are obtained and
  # renewed from Let's Encrypt without a cron entry or a renewal hook, which is
  # the whole reason it is Caddy — on a single host, certificate lifecycle is
  # the entire job.
  #
  # Port 80 is published as well as 443, and both are needed: the ACME HTTP
  # challenge arrives on 80, and Caddy redirects everything else from it.
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      KAROBAKBAK_DOMAIN: "${KAROBAKBAK_DOMAIN:?the public hostname, e.g. karobakbak.com}"
      ACME_EMAIL: "${ACME_EMAIL:?where Let's Encrypt sends renewal warnings}"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume means
      # re-issuing, which Let's Encrypt rate limits — it is not a cache.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - frontend
    # The anchor lives on the first service that uses it; every other service
    # below references it.
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # Both carry `profiles: ["ops"]` in the base file so a bare `docker compose
  # up` on a laptop does not demand operator secrets. Production always wants
  # them, so the profile is cleared here rather than relying on somebody
  # remembering `--profile ops` on the one stack where forgetting it means no
  # backups and no pages.
  backup:
    profiles: !reset []

  alertmanager:
    profiles: !reset []

  frontend:
    # No published port at all. Caddy reaches it over the compose network, and
    # nothing else should reach it — this used to bind loopback because the TLS
    # terminator was assumed to be on the host rather than beside it.
    ports: !reset []
    logging: *logging
    build:
      args:
        # Required in production, unlike development, because the age gate links
        # both and they must be reachable *without* passing it. A production
        # build without them ships a screen stating obligations the user cannot
        # go and read, which is worse than no screen — see
        # docs/policies/README.md step 5.
        VITE_TERMS_URL: "${VITE_TERMS_URL:?the published Terms URL, e.g. https://karobakbak.com/terms}"
        VITE_PRIVACY_URL: "${VITE_PRIVACY_URL:?the published Privacy Policy URL}"

  backend:
    environment:
      NODE_ENV: production
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      BACKEND_PORT: "8080"
      BACKEND_HOST: "0.0.0.0"
      # However many proxies actually sit in front. Too high and a client can
      # forge its own address in X-Forwarded-For, which defeats rate limiting
      # and blocks at once.
      # Caddy -> nginx -> here is **two**. A CDN in front makes it three.
      # Too low and every user shares one apparent address, collapsing rate
      # limits and blocks onto each other; too high and a client picks its own
      # address with a header and sheds its bans (§6.5).
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:?how many proxies sit in front of this — Caddy plus nginx is 2}"
      # The public origin, exactly: scheme, host and port. An empty allowlist
      # is a startup failure in production (R9).
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?the public origin, e.g. https://karobakbak.com}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      DATABASE_URL: "${DATABASE_URL:?postgres connection string, from secret management}"
      DATABASE_SSL: "true"
      DATABASE_REQUIRE_SSL_IN_PRODUCTION: "true"
      # Salts every IP hash. Changing it later invalidates every existing
      # IP-dimension block, so pick it once and keep it secret.
      IP_HASH_SALT: "${IP_HASH_SALT:?a long random value, kept secret}"
      SPOOL_DIR: "/var/lib/karobakbak/spool"
      METRICS_ENABLED: "true"
      # The shipped defaults. Not tunable here on purpose: these are abuse
      # controls, and the only reason to raise them is a load test, which runs
      # against its own stack.
      CONN_RATE_LIMIT: "60"
      MAX_CONNECTIONS_PER_IP: "40"
    logging: *logging
    deploy:
      replicas: 1
      resources:
        limits:
          # Matches the 384 MB heap the image pins, with room for the runtime.
          memory: 640M

  migrate:
    environment:
      NODE_ENV: production
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?the public origin}"
      # Deliberately a *different* credential from the application's: this role
      # may CREATE, and the application's may not (§8.1). Point it at the same
      # database with a migration user.
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?a migration credential, not the application's}"
      DATABASE_SSL: "true"
      DATABASE_REQUIRE_SSL_IN_PRODUCTION: "true"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
    logging: *logging

  redis:
    # Nothing published. Reaching Redis means being inside the network.
    ports: !reset []
    logging: *logging

  postgres:
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?database superuser name}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?database superuser password}"
      POSTGRES_DB: "${POSTGRES_DB:-karobakbak}"
    # Nothing published: it holds plaintext conversation content, and reaching
    # it should require being inside the network or coming through a bastion
    # (§8.1). The volume behind it is where encryption at rest belongs.
    ports: !reset []
    logging: *logging

  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
    ports: !reset []
    logging: *logging

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?grafana admin user}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?grafana admin password}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3000}"
    # Loopback only. Reach it over an SSH tunnel rather than publishing a
    # dashboard with an admin login to the internet.
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    logging: *logging

# Caddy's certificate store. Declared here rather than in the base file because
# nothing outside production terminates TLS.
volumes:
  caddydata:
  caddyconfig:
