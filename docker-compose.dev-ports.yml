# Opt-in port publishing, for looking inside the running stack with a database
# client (DBeaver, psql, RedisInsight).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml up -d
#   npm run up:inspect          # the same thing, from the repo root
#
# ---------------------------------------------------------------------------
# WHY THIS IS A SEPARATE FILE AND NOT A DEFAULT
# ---------------------------------------------------------------------------
# `docker-compose.yml` publishes no host port for PostgreSQL or Redis on
# purpose (§8.1). PostgreSQL holds plaintext conversation content, and reaching
# it should require being inside the network. That default is worth keeping, so
# this override has to be asked for by name — a `docker-compose.override.yml`
# would apply automatically and quietly undo the decision.
#
# Both are bound to **127.0.0.1**, not to `0.0.0.0`. Compose's short port syntax
# listens on every interface, which on a laptop being used for LAN testing means
# publishing the message store to the whole network. The explicit loopback
# address is the difference between "I can inspect this" and "anyone on the
# café wifi can read the conversations".
#
# Ports are 5434 and 6381 rather than the defaults, so this cannot collide with
# a PostgreSQL or Redis installed on the host, nor with the integration-test
# stack in `docker-compose.test.yml` (5433 / 6380).
#
# This is a development convenience. Nothing here belongs in a deployment: in
# production the database is reached through a bastion or a tunnel, with
# credentials from secret management and TLS, never by publishing a port.

services:
  postgres:
    ports:
      - "127.0.0.1:5434:5432"

  redis:
    ports:
      - "127.0.0.1:6381:6379"
