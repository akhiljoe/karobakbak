<!doctype html>
<!--
  Where a popup sign-in lands, and the only thing it does is close itself.

  WHY THIS FILE EXISTS RATHER THAN THE APPLICATION
  A popup that lands on `/` loads the whole bundle, renders the landing page
  inside a 480px window, and sits there looking like a second copy of the site.
  This is a few hundred bytes that reports the outcome to whoever opened it and
  closes.

  WHY THE SCRIPT IS A SEPARATE FILE
  `script-src 'self'` carries no `'unsafe-inline'`, so an inline `<script>` here
  would be blocked by the Content Security Policy and the window would never
  close — silently, since a CSP violation is a console message and this window
  is about to disappear. See `frontend/security-headers.conf`.

  It is deliberately not under `/auth/`: that prefix is proxied to the backend,
  and this is a static file the edge can serve without waking a Node process.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Signing you in — karobakbak</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /*
        No webfont. The page is visible for about as long as it takes to read
        one word, and a font request that lands after the window has closed is
        a request that was never worth making.
      */
      :root { color-scheme: dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #13100b;
        color: #e8e2d6;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { padding: 24px; max-width: 22rem; }
      svg { display: block; margin: 0 auto 18px; }
      p { margin: 0; font-size: 0.95rem; line-height: 1.6; color: #a39b8c; }
      a { color: #ffb420; }
      /*
        Shown only when there is nothing to close — somebody who reached this
        address directly. `[hidden]` is honoured, the script un-hides it.
      */
      #stranded { margin-top: 14px; }
    </style>
  </head>
  <body>
    <main>
      <!-- The mark, matching public/favicon.svg. Inline so it costs no request. -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
        <path d="M17.2 15.5 A 11.9 11.9 0 0 1 17.2 32.5" stroke="#ffb420" stroke-width="3.1" stroke-linecap="round" fill="none"/>
        <path d="M31.2 18.6 A 8.6 8.6 0 0 0 31.2 29.4" stroke="#ffc94a" stroke-opacity="0.5" stroke-width="3.1" stroke-linecap="round" fill="none"/>
        <circle cx="25" cy="24" r="1.5" fill="#ffb420"/>
      </svg>
      <p id="status">Signing you in…</p>
      <p id="stranded" hidden>You can close this window and return to <a href="/">karobakbak</a>.</p>
    </main>
    <script src="/signin-done.js"></script>
  </body>
</html>
