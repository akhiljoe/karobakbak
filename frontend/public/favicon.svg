<!--
  The karobakbak mark: two arcs facing each other with a point between them.

  Inset slightly from `src/components/Logo.tsx` so the strokes clear the plate's
  rounded corners; the proportions are otherwise the same mark. If
  the mark changes there, it changes here — a favicon that has drifted from the
  logo is the kind of thing nobody notices and everybody feels.

  The rounded plate is part of it. Without a background the thin strokes vanish
  against a browser tab's own colour, and at 16px an unplated mark reads as
  noise.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" rx="11" fill="#13100b"/>
  <path d="M17.2 15.5 A 11.9 11.9 0 0 1 17.2 32.5" stroke="#ffb420" stroke-width="3.1" stroke-linecap="round" fill="none"/>
  <path d="M31.2 18.6 A 8.6 8.6 0 0 0 31.2 29.4" stroke="#ffc94a" stroke-opacity="0.5" stroke-width="3.1" stroke-linecap="round" fill="none"/>
  <circle cx="25" cy="24" r="1.5" fill="#ffb420"/>
</svg>
