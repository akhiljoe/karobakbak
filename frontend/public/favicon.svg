<!--
  The karobakbak mark: two arcs facing each other with a point between them.

  Kept byte-for-byte consistent in geometry with `src/components/Logo.tsx`. If
  the mark changes there, it changes here — a favicon that has drifted from the
  logo is the kind of thing nobody notices and everybody feels.

  The rounded plate is part of it. Without a background the thin strokes vanish
  against a browser tab's own colour, and at 16px an unplated mark reads as
  noise.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" rx="11" fill="#13100b"/>
  <path d="M31 12 A 16 16 0 0 0 31 36" stroke="#ffb420" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <path d="M17 12 A 16 16 0 0 1 17 36" stroke="#ffc94a" stroke-opacity="0.5" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <circle cx="24" cy="24" r="2.6" fill="#ffb420"/>
</svg>
