# Included into every location rather than set once at server level.
#
# nginx's `add_header` does not merge: a location that sets any header of its
# own drops every header inherited from its parent. The cache-control on
# /index.html and /assets/ therefore silently removed the CSP from exactly the
# responses that carry the application. Repeating them through an include is the
# only way to be sure a location has them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
