# Included into every location rather than set once at server level.
#
# nginx's `add_header` does not merge: a location that sets any header of its
# own drops every header inherited from its parent. The cache-control on
# /index.html and /assets/ therefore silently removed the CSP from exactly the
# responses that carry the application. Repeating them through an include is the
# only way to be sure a location has them.
# `connect-src` is 'self' and nothing else. It used to read `'self' ws: wss:`,
# and a bare scheme source matches **every host** — so the one directive that
# stops injected script opening an outbound channel was, for WebSockets,
# absent. That matters more here than on most origins: this page renders
# message content, and the first rule of this system is that message content
# never leaves the trusted boundary. `script-src 'self'` means the bundle is
# the only script that runs, so the realistic path is a compromised dependency
# — and that is exactly the case a wildcard `wss:` would have let stream a
# whole conversation to somebody else's server.
#
# The schemes are not needed: CSP Level 3 matches a same-origin ws/wss upgrade
# against 'self', and the client derives its socket URL from the page origin by
# default. A deployment that points VITE_WS_URL at a different origin must name
# that exact origin here.
#
# The Razorpay sources mirror the meta tag in `index.html`, and they have to:
# a browser enforces the intersection of the two, so a checkout permitted in one
# and not the other is a checkout that does not open. This file is the one that
# matters in production — a header outranks a meta tag — and it is the one the
# rejected prototype never touched, which would have left the integration
# working in `npm run dev` and blocked in every deployed build.
#
# `script-src` names one host and does not carry `'unsafe-inline'`. See the
# longer note in `index.html`; the short version is that the checkout form runs
# in an iframe under Razorpay's own policy, so nothing is gained here by
# relaxing the directive that stops injected script from running on the origin
# that renders message content.
#
# `connect-src` keeps its narrowness everywhere else: `https://*.razorpay.com`
# is a host pattern, not a bare scheme. The comment above is about `ws:` and
# `wss:` matching *every* host, which is a different and much larger hole.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.razorpay.com; connect-src 'self' https://*.razorpay.com; font-src 'self'; frame-src https://*.razorpay.com; object-src 'none'; base-uri 'none'; form-action 'self' https://*.razorpay.com; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
