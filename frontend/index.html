<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Matches the page background, so mobile browser chrome does not flash white. -->
    <meta name="theme-color" content="#13100b" />
    <title>karobakbak — Anonymous random chat with strangers</title>
    <meta
      name="description"
      content="Talk to someone you've never met. Free, anonymous random chat. No sign-up, no app."
    />
    <!--
      Link previews (WhatsApp, Instagram, Facebook, X, Discord, Slack).

      Static on purpose: the crawlers that build a preview card do not run
      JavaScript, so they only ever see this file. Every page therefore shares
      one card. `src/meta.ts` updates the title, description and canonical per
      page for the crawlers that do run script — Google among them.

      The image URL is absolute because several of those crawlers ignore a
      relative one. It is a static file in `public/`, served by this origin, so
      nothing here makes a browser contact a third party.
      `docs/brand/og-card.html` is its source.
    -->
    <link rel="canonical" href="https://karobakbak.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="karobakbak" />
    <meta property="og:url" content="https://karobakbak.com/" />
    <meta property="og:title" content="karobakbak — Talk to someone you've never met" />
    <meta
      property="og:description"
      content="Free, anonymous random chat. No sign-up, no app. Open it and start talking."
    />
    <meta property="og:image" content="https://karobakbak.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="karobakbak: Talk to someone you've never met. Anonymous. Free. No sign-up."
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="karobakbak — Talk to someone you've never met" />
    <meta
      name="twitter:description"
      content="Free, anonymous random chat. No sign-up, no app. Open it and start talking."
    />
    <meta name="twitter:image" content="https://karobakbak.com/og-image.png" />

    <!--
      Content Security Policy.

      The strongest control the frontend has, because message text is rendered
      as untrusted content from another person. React escapes it, but a policy
      that forbids inline and remote script means a mistake anywhere in the
      pipeline still cannot execute.

      `connect-src 'self'` covers the WebSocket too: same origin, which is what
      the compose topology and the dev proxy both serve. The nginx image in
      phase 11 sends the same policy as a header, which is what a browser
      honours most strictly; this tag is the floor, not the ceiling.

      ---------------------------------------------------------------------
      THE RAZORPAY SOURCES, AND THE ONE THAT IS NOT HERE
      ---------------------------------------------------------------------
      The checkout needs to be fetched, framed and talked to. Each origin below
      is named for exactly one of those, and `script-src` is the tightest of
      them: one host, not a wildcard, because that directive is what stops an
      injected string executing.

      **`'unsafe-inline'` is deliberately absent from `script-src`.** Adding it
      is what the rejected prototype did, and it disables the strongest control
      this origin has — on a page that renders text written by a stranger —
      for a script two pages use. The checkout form runs inside an iframe on
      Razorpay's own origin under Razorpay's own policy, so nothing they inject
      is governed by this line. If a live checkout turns out to need an inline
      script in *this* document, that is a decision to take deliberately and
      record, not a directive to widen because something did not work.

      These sources are permitted while `PAYMENTS_ENABLED` is false, and nothing
      loads them: `payment.ts` injects the script only when somebody chooses to
      pay. A permitted-and-unused origin costs nothing; keeping the policy and
      the code in one commit is worth more than the day of narrowness.

      Every change here must be mirrored in `security-headers.conf`, which is
      the policy a browser actually enforces in production. A browser applies
      the intersection of the two, so widening only this tag — as the prototype
      did — changes nothing in a deployed build and the checkout stays blocked.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.razorpay.com; connect-src 'self' ws: wss: https://*.razorpay.com; font-src 'self'; frame-src https://*.razorpay.com; object-src 'none'; base-uri 'none'; form-action 'self' https://*.razorpay.com; frame-ancestors 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>karobakbak needs JavaScript to hold a live conversation.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
