# The edge: static assets, and the WebSocket upgrade proxied to the backends.
#
# Serving both from one origin is what makes the block-token cookie SameSite=Lax
# work, and it is what the CSP's `connect-src 'self'` assumes.

upstream backends {
    # Two backends, to prove cross-instance correctness locally (R5). Least
    # connections rather than round robin: these are long-lived WebSockets, so
    # what matters is how many each instance is already holding, not whose turn
    # it is.
    least_conn;
    server backend:8080 max_fails=3 fail_timeout=10s;
    server backend-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # Security headers live in an include, because nginx replaces rather than
    # merges inherited `add_header` directives: any location that sets one of
    # its own loses all of them. See security-headers.conf.
    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they can be cached hard. index.html cannot.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location /ws {
        proxy_pass http://backends;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # One trusted proxy, so the backend is configured with
        # TRUST_PROXY_HOPS=1 and reads the rightmost entry — the address this
        # proxy saw, not whatever the client claimed (§6.5).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat socket is idle whenever nobody is typing. The default 60s
        # would close every conversation during a pause.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Health endpoints are proxied for debugging, but never /metrics: the
    # scrape is for Prometheus on the private network, not for the internet.
    location = /health {
        proxy_pass http://backends;
    }

    location = /ready {
        proxy_pass http://backends;
    }

    location = /metrics {
        return 404;
    }
}
