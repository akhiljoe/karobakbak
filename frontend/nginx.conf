# The edge: static assets, and the WebSocket upgrade proxied to the backends.
#
# Serving both from one origin is what makes the block-token cookie SameSite=Lax
# work, and it is what the CSP's `connect-src 'self'` assumes.

# ---------------------------------------------------------------------------
# WHY THERE IS NO `upstream` BLOCK
# ---------------------------------------------------------------------------
# The backends are replicas of one compose service, so their number is not
# known here — `--scale backend=N` changes it without touching this file. A
# static `upstream` listing `backend:8080` and `backend-2:8080` was what this
# used to be, and it had two faults: it hard-coded the replica count, and nginx
# resolves upstream hostnames **once at startup**, so a replica replaced later
# kept receiving traffic at an address that no longer existed.
#
# Docker's embedded DNS returns one A record per replica, so re-resolving on a
# short TTL is the membership list. `proxy_pass` to a *variable* is what makes
# nginx use the resolver at request time rather than caching the first answer
# at boot.
#
# The cost is honest and worth stating: this loses `least_conn`, which suited
# long-lived WebSockets better than DNS round-robin, and it loses passive
# health checks (`max_fails`). Neither is load-bearing today — production runs
# a single replica (cost §26) and the second exists on a laptop to prove
# cross-instance correctness, not to balance load. Scaling production past one
# means putting a real load balancer in front, which is where connection-aware
# balancing belongs anyway.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------------
# GEOGRAPHIC RESTRICTION
# ---------------------------------------------------------------------------
# `docs/policies/JURISDICTIONS.md` recommends launching with the EEA and the UK
# blocked. The reasoning there in one line: those are the only regions that cost
# real money *before* there are any users — two mandated paid representatives
# under separate regimes, two statutory written risk assessments, and
# notice-and-action machinery, none of which scales with usage and all of which
# is owed on day one for a single visitor.
#
# WHY A HEADER AND NOT A GEOIP DATABASE
# The nginx alpine image ships no geoip2 module, so a database lookup would mean
# building a custom image and shipping a country database that goes stale. Every
# CDN worth putting in front of this already resolves the country and hands it
# over in a header, which is one lookup nobody has to maintain.
#
# The header below is Cloudflare's. Other edges use different names — change the
# `map` source, not the list.
#
# WHY IT FAILS OPEN
# An absent header means "no CDN in front", which is the development case and
# the case where somebody reached the origin directly. Failing closed there
# would make a misconfigured deployment refuse every visitor, and would break
# the container health check, which arrives from 127.0.0.1 with no header at
# all.
#
# That is a real gap and the mitigation is not in this file: **the origin must
# not be reachable except through the edge.** In production Caddy is the only
# thing that talks to this container and the frontend publishes no port at all,
# so bypassing the CDN means reaching a host that does not answer.
#
# 451 rather than 403, deliberately: "Unavailable For Legal Reasons" is exactly
# what this is, and it says so to anybody who looks.
map $http_cf_ipcountry $geo_blocked {
    default 0;

    # EU member states
    AT 1; BE 1; BG 1; HR 1; CY 1; CZ 1; DK 1; EE 1; FI 1; FR 1;
    DE 1; GR 1; HU 1; IE 1; IT 1; LV 1; LT 1; LU 1; MT 1; NL 1;
    PL 1; PT 1; RO 1; SK 1; SI 1; ES 1; SE 1;

    # EEA, non-EU
    IS 1; LI 1; NO 1;

    # United Kingdom
    GB 1;
}



# ---------------------------------------------------------------------------
# THE ACCESS LOG
# ---------------------------------------------------------------------------
# The client address IS logged, and that is a deliberate operator decision
# (F-036, reversed). An access log without an address is very hard to debug
# with and hard to investigate abuse from, and the privacy policy is the
# operator's to write around the system rather than the other way round.
#
# What is NOT logged is the query string, and that is a different question
# entirely. `$request` is the raw request line, and `/auth/callback?code=...`
# is proxied through this server — so the stock format writes an OIDC
# authorization code, a single-use bearer credential, into an access log on
# every completed sign-in. `$uri` is the normalised path and carries no query
# string, so the credential cannot be expressed by the format at all.
#
# Nobody has ever debugged anything with an authorization code, so this costs
# the operator nothing and closes the one part of F-036 that was not a policy
# question.
#
# JSON because the backend already emits one JSON object per line, so the log
# shipper has one parser and the two streams join on the same field names.
# `escape=json` is what keeps a crafted URI from breaking the object.
# The container's own health check hits `/` every ten seconds for the life of
# the container, and every one of those writes an access log line. Unshipped
# that is noise; shipped to a log store it is the majority of the volume, paid
# for for ever, describing nothing that happened.
map $remote_addr $kbb_loggable {
    default   1;
    "127.0.0.1" 0;
    "::1"       0;
}

log_format kbb_access escape=json
    '{'
    '"time":"$time_iso8601",'
    '"stream":"nginx_access",'
    '"remote_addr":"$remote_addr",'
    '"forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_seconds":$request_time,'
    '"user_agent":"$http_user_agent",'
    '"upstream":"$upstream_addr",'
    '"upstream_seconds":"$upstream_response_time",'
    '"geo_blocked":$geo_blocked,'
    '"conn":"$connection"'
    '}';

server {
    listen 80;
    server_name _;

    # Overrides the image's `access_log /var/log/nginx/access.log main`, which
    # is a symlink to stdout. Set at server level so every location inherits it
    # — including the ones that `return` before reaching a location body.
    access_log /dev/stdout kbb_access if=$kbb_loggable;

    # Security headers live in an include, because nginx replaces rather than
    # merges inherited `add_header` directives: any location that sets one of
    # its own loses all of them. See security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # A plain page rather than nginx's default, because the visitor is not a
    # user who did something wrong and should not be told they made a bad
    # request. `internal` so it cannot be fetched directly and mistaken for a
    # blocked page by somebody who is not blocked.
    error_page 451 /451.html;
    location = /451.html {
        internal;
        root /usr/share/nginx/html;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        include /etc/nginx/security-headers.conf;

        # Inside the location, not at server level, and this is not a style
        # preference. `error_page` does not intercept a `return` issued from an
        # `if` in the server block — the status arrives with an empty body, which
        # was verified against nginx 1.27 rather than assumed. Inside a location
        # the interception works and the visitor gets the page.
        if ($geo_blocked) { return 451; }

        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they can be cached hard. index.html cannot.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location /ws {
        # The block that actually matters. Refusing the page while leaving the
        # socket open would restrict nothing: the client is a WebSocket, and
        # anybody who already has the bundle — or a script that never needed it —
        # would connect straight past a blocked landing page.
        if ($geo_blocked) { return 451; }

        # A variable, so nginx resolves `backend` per request through the
        # resolver above rather than pinning to one address at startup.
        set $backend_upstream "backend:8080";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # One trusted proxy, so the backend is configured with
        # TRUST_PROXY_HOPS=1 and reads the rightmost entry — the address this
        # proxy saw, not whatever the client claimed (§6.5).
        #
        # THAT NUMBER CHANGES THE MOMENT ANYTHING IS PUT IN FRONT.
        # The geo-blocking above needs a CDN to set the country header, and a
        # CDN is another hop. Production already runs Caddy in front of this, so
        # the chain is two; adding a CDN makes it three.
        #
        # Getting it wrong is silent and serious. `clientAddress()` counts N
        # entries from the right, so a TRUST_PROXY_HOPS lower than the real
        # chain reads an entry the *client* wrote — handing every visitor a free
        # choice of rate-limit bucket and a way to shed their blocks with a
        # header. Measure the chain against the running stack after any change
        # to what sits in front, the way the Caddyfile comment records having
        # done.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The country Cloudflare resolved, forwarded so the backend can show a
        # stranger where their partner is connecting from.
        #
        # Set explicitly rather than relied on to pass through, so the value the
        # backend sees is the one this block chose. It is still only as
        # trustworthy as the assumption that Cloudflare is in front — the same
        # assumption the geo-block above already makes, and the reason the
        # backend ignores this header entirely unless TRUST_PROXY_HOPS says
        # there is a proxy.
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        # A chat socket is idle whenever nobody is typing. The default 60s
        # would close every conversation during a pause.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The four sign-in routes (§32, D48): /auth/start, /auth/callback,
    # /auth/session, /auth/signout.
    #
    # A prefix location, not four exact ones, because they are one flow and a
    # fifth would otherwise fall through to `location /` and be answered with
    # index.html — a 200 carrying the SPA, which is the worst possible failure
    # for a route the browser is following a redirect into.
    #
    # WHY THIS HAS TO EXIST AT ALL
    # The backend publishes no host port. Cognito redirects the browser to
    # AUTH_REDIRECT_URI, which is this origin, so without this block the
    # callback lands on the static file server and sign-in completes into a
    # blank page with no error anywhere.
    #
    # Geo-blocked with everything else: signing in is a visitor action, so
    # leaving it open would restrict nothing, exactly as for /ws.
    location /auth/ {
        include /etc/nginx/security-headers.conf;
        if ($geo_blocked) { return 451; }

        set $backend_auth "backend:8080";
        proxy_pass http://$backend_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The payment routes.
    #
    # Two locations rather than one `/api/`, because the two have opposite
    # threat models and only one of them is a browser request.
    #
    # ---------------------------------------------------------------------
    # THE GEO-BLOCK APPLIES TO ONE AND MUST NOT APPLY TO THE OTHER
    # ---------------------------------------------------------------------
    # `create-order` is a visitor action and is blocked with everything else:
    # refusing the page while leaving a route open that creates orders would
    # restrict nothing, exactly as it would for `/ws`.
    #
    # The webhook is not a visitor. It is Razorpay's server calling ours, from
    # wherever their infrastructure happens to sit, about a payment that has
    # already been taken. Geo-blocking it would drop delivery for a payment
    # made by somebody who was never blocked — the money is gone and the
    # entitlement never lands. Its authentication is the HMAC, not the country.
    location = /api/payments/create-order {
        if ($geo_blocked) { return 451; }

        set $backend_orders "backend:8080";
        proxy_pass http://$backend_orders;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/webhooks/razorpay {
        set $backend_webhook "backend:8080";
        proxy_pass http://$backend_webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The signature covers the exact bytes sent. `proxy_request_buffering`
        # stays on so the body arrives whole, and nothing here rewrites it —
        # any transformation between Razorpay and the verifier invalidates
        # every delivery, and the symptom would be a uniform 401 that looks
        # like a wrong secret.
        proxy_set_header X-Razorpay-Signature $http_x_razorpay_signature;
    }

    # Health endpoints are proxied for debugging, but never /metrics: the
    # scrape is for Prometheus on the private network, not for the internet.
    location = /health {
        set $backend_health "backend:8080";
        proxy_pass http://$backend_health;
    }

    location = /ready {
        set $backend_ready "backend:8080";
        proxy_pass http://$backend_ready;
    }

    location = /metrics {
        return 404;
    }
}
