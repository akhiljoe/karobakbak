# The checks this repository already had, run by something other than memory.
#
# `npm run verify` and the integration suite existed and were good. Nothing ran
# them: there was no CI, no build, and no pre-commit hook, so every check was
# opt-in at the moment somebody remembered.
#
# That matters more here than it would in most repositories, because a dozen of
# this system's load-bearing invariants are enforced *by tests* rather than by
# types, and each fails silently when it regresses:
#
#   * the logger's recursive field denylist, which is the primary control
#     keeping message content inside the trusted boundary (I8)
#   * the ban on `innerHTML` in `console.js`, on an origin whose session can
#     read every retained conversation
#   * the two database roles being genuinely separated — `karobakbak_app`
#     denied `admin_accounts`, `karobakbak_console` unable to delete a
#     conversation (D32)
#   * blocks and bans living in separate namespaces, so revoking a ban cannot
#     delete a user's own block (D29)
#   * the byte-identity of the two protocol files
#   * every declared metric having a write site
#
# A control that is only checked when remembered is not a control.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push supersedes an older run on the same ref. Not on the default
# branch, where every commit's result is worth having on its own.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: protocol, types, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm run install:all

      # Protocol drift check, both typechecks, the backend unit suite and the
      # frontend suite — the same command a developer runs locally, so there is
      # one definition of "verified" rather than two that can disagree.
      - name: Verify
        run: npm run verify

      # `.gitattributes` normalises everything to LF because the backend and
      # frontend both run in Linux containers, where a CRLF in a shell script,
      # a Dockerfile or an nginx config breaks the image. Git will normalise on
      # commit, but a file committed from a tool that wrote CRLF and bypassed
      # that would not be caught by any test — so it is caught here.
      #
      # Matched positively on `w/crlf` rather than by excluding the endings that
      # are acceptable. The exclusion list was `w/lf` and `w/none`, which quietly
      # meant "any file that is not one of these two is a failure" — and a binary
      # file is neither. It reports `w/-text`, so the first PNG committed to this
      # repository turned this step red and kept it red, for a file that has no
      # line endings to get wrong.
      #
      # Listing the acceptable endings cannot be completed correctly, because the
      # set grows whenever git learns a new one. Naming the single unacceptable
      # ending can.
      - name: No CRLF in tracked files
        run: |
          if git ls-files --eol | grep 'w/crlf'; then
            echo "::error::tracked files above have CRLF in the working tree"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # SUPPLY CHAIN (phase 31)
  # ---------------------------------------------------------------------------
  # The cheapest of the four security axes and the only one that runs
  # unprompted. It watches the two things nothing else in this repository looks
  # at: what the dependency tree has become since it was last read, and whether
  # a secret has been committed.
  #
  # Its own job rather than steps on `verify`, so a vulnerable transitive
  # dependency does not stop somebody seeing whether their code compiles. They
  # are different questions with different urgencies.
  supply-chain:
    name: dependencies and secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan it. A secret that was committed and
          # then removed is still a leaked secret — the fix is rotation, and the
          # first step is knowing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `--omit=dev` on purpose. A vulnerability in a test runner is worth
      # knowing about and is not worth failing a build over: it does not ship,
      # it cannot be reached by a request, and treating it the same as something
      # in the process holding every WebSocket file descriptor is how an audit
      # gate gets disabled within a month.
      #
      # `high` rather than `moderate`, for the same reason. A gate that fires on
      # things nobody is going to act on today stops being read.
      # `npm audit --omit=dev` reads the committed lockfile and filters dev
      # dependencies itself. It used to be preceded by
      # `npm install --package-lock-only --omit=dev`, which was belt-and-braces
      # and **rewrote the lockfile in place** — so the "lockfiles agree" step
      # below then reported a change that this step had made, and blamed
      # `npm ci` for it.
      #
      # What it rewrote was not the dependency tree. The committed lockfile is
      # written by npm 11, which records `"libc": ["glibc"]` on optional native
      # packages; npm 10 does not know that field and silently drops it — 42
      # lines of it. Every runner image on Node 20 *and* 22 currently ships
      # npm 10, so this fired on every push regardless of the Node version.
      #
      # The rule this restores: a CI step may read the working tree or write to
      # it, and a step that does both while a later step audits the difference
      # will eventually accuse the wrong command.
      - name: Audit production dependencies
        run: |
          set -o pipefail
          for pkg in backend frontend; do
            echo "::group::npm audit ($pkg)"
            npm --prefix "$pkg" audit --omit=dev --audit-level=high
            echo "::endgroup::"
          done

      # Informational, and deliberately not a gate. Everything below `high`
      # belongs in a weekly read rather than in the path of a commit.
      - name: Report everything below the gate
        if: always()
        run: |
          for pkg in backend frontend; do
            echo "::group::full audit ($pkg)"
            npm --prefix "$pkg" audit --omit=dev || true
            echo "::endgroup::"
          done

      # The `.env` files are gitignored and `.env.example` is not, which is
      # exactly the arrangement where a real value gets pasted into the wrong
      # one. The Razorpay keys, the Cognito client secret, the backup
      # passphrase, the model provider key and the Grafana admin password are
      # all things this repository knows the shape of.
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A lockfile that changes without its manifest changing is either a
      # deliberate `npm update` or somebody's editor. Both are fine; being
      # unable to tell them apart is not, because the diff is thousands of lines
      # and nobody reads it.
      # Runs on a tree no earlier step has written to, which is the only way
      # its verdict means anything.
      - name: Lockfiles agree with their manifests
        run: |
          git diff --quiet -- backend/package-lock.json frontend/package-lock.json ||
            { echo "::error::a lockfile was modified before this step ran"; exit 1; }
          for pkg in backend frontend; do
            npm --prefix "$pkg" ci --ignore-scripts --omit=dev >/dev/null
          done
          if ! git diff --quiet -- backend/package-lock.json frontend/package-lock.json; then
            echo "::error::a lockfile changed during a clean install — it is out of step with its package.json"
            git diff --stat -- backend/package-lock.json frontend/package-lock.json
            exit 1
          fi

  integration:
    name: integration (redis + postgres)
    runs-on: ubuntu-latest

    # The race tests, the janitor tests and the database-role assertions live
    # here. They are the checks least likely to be run by hand and the most
    # expensive to be wrong about, which is the whole argument for this job.
    services:
      redis:
        image: redis:7-alpine
        # Default configuration, unlike docker-compose.test.yml, which starts
        # Redis with persistence off to match production (D12). A service
        # container takes docker *options* and not a command, so those flags
        # cannot be passed here. Nothing in the suite depends on them: the tests
        # flush between contexts and none asserts anything about what does or
        # does not reach disk.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        ports:
          - 6380:6379

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karobakbak
          POSTGRES_PASSWORD: karobakbak
          POSTGRES_DB: karobakbak_test
        options: >-
          --health-cmd "pg_isready -U karobakbak -d karobakbak_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm --prefix backend install

      - name: Integration suite
        run: npm run test:integration
        env:
          TEST_REDIS_URL: redis://localhost:6380
          TEST_DATABASE_URL: postgres://karobakbak:karobakbak@localhost:5433/karobakbak_test
