# Deploy to the live stack on the single production host (a host behind a
# Cloudflare Tunnel). docs/operations/DEPLOY.md.
#
# Manual on purpose: Actions → deploy → Run workflow. Merging to main deploys
# nothing. A restart nobody chose, in the middle of a conversation, costs more
# than a deploy that waited.
#
# HOW THE HOST HEARS ABOUT IT
#
# A self-hosted runner on the host long-polls GitHub over outbound HTTPS, the
# same direction cloudflared already dials. Nothing on the internet connects
# in, and no port is opened. If the host is offline the job waits in the queue
# (up to a day) and runs when it is back.
#
# WHERE THE RUNNER MAY BE REGISTERED
#
# The runner is registered only to a private deployment repository, and must
# never be registered on a public repository: pull requests on a public
# repository can run code on self-hosted runners. Only jobs asking for the
# `karobakbak-live` label reach the host, and verify.yml asks for
# `ubuntu-latest`.

name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "main, a commit SHA, a live-* tag, or 'previous' to roll back"
        required: true
        default: main

# One at a time, and a second click waits rather than cancelling one that is
# halfway through restarting containers.
concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  contents: write # the live-* release tag
  actions: read # whether verify.yml passed for the commit

jobs:
  deploy:
    runs-on: [self-hosted, karobakbak-live]
    timeout-minutes: 30
    steps:
      # The deploy script from the commit being deployed, so a fix to the
      # script ships with the commit that needs it. The live checkout itself is
      # moved by the script, not by this step.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref == 'previous' && 'main' || inputs.ref }}
          sparse-checkout: ops/laptop/deploy.mjs
          sparse-checkout-cone-mode: false

      - name: Deploy
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never interpolated into the
          # script: an input is text somebody typed.
          DEPLOY_REF: ${{ inputs.ref }}
          # Empty means %USERPROFILE%\karobakbak-live; see deploy.mjs.
          LIVE_DIR: ${{ vars.LIVE_DIR }}
        # One line with no shell syntax, so it reads the same to PowerShell
        # here and to the bash parser in scripts/verify-workflows.
        run: node ops/laptop/deploy.mjs
