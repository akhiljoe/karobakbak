# The stack. Development by default.
#
#   docker compose up --build -d      (or: npm run up)
#   open http://localhost:8081
#
# Production is the same file with an override that replaces every value that
# should not be shared between a laptop and the internet:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ---------------------------------------------------------------------------
# WHY DEVELOPMENT IS THE DEFAULT AND PRODUCTION IS THE OVERRIDE
# ---------------------------------------------------------------------------
# The other way round — a base that runs nothing until an environment is named
# — is safer on paper and worse in practice: the command typed twenty times a
# day becomes the long one, and the short one becomes a footgun people alias
# their way around. So the default is the harmless environment, and reaching
# production takes an explicit second file.
#
# The backstop is that `docker-compose.prod.yml` **requires** every secret with
# no default. A deployment that forgets the override does not quietly run with
# development credentials; it runs a stack whose salt is literally called
# `local-development-salt-change-me`, against a database it will refuse to
# reach without TLS.
#
# Two backend replicas here, deliberately. Production starts at **one**
# (cost §26); the second exists on a laptop to prove cross-instance correctness
# — that matchmaking, delivery and cleanup work when two processes mutate the
# same Redis, rather than only appearing to because there is one. It has caught
# real bugs, most recently retention losing records to a cross-instance write
# order.
#
# They are **replicas of one service**, not two services. That is what makes
# them `karobakbak-backend-1` and `karobakbak-backend-2` rather than
# `backend-1` and `backend-2-1` — compose names containers
# `<project>-<service>-<replica>`, so a service called `backend-2` produced a
# container ending in two different numbers. Scaling is also the honest model:
# nothing distinguishes one instance from another, every transition is a Lua
# script precisely so that holds, and `--scale backend=N` is how it grows.
#
# Everything is tunable through the environment so a different profile needs an
# env file, not another compose file. `.env.loadtest` is exactly that.

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Empty, so the client derives the socket URL from the page origin —
        # which is what keeps the block-token cookie same-site.
        VITE_WS_URL: ""
        VITE_ADS_ENABLED: "${VITE_ADS_ENABLED:-false}"
        VITE_ADS_PROVIDER: "${VITE_ADS_PROVIDER:-noop}"
        # Unset here on purpose: there is nowhere to point a development build,
        # and the age gate says so on screen rather than linking nothing.
        VITE_TERMS_URL: "${VITE_TERMS_URL:-}"
        VITE_PRIVACY_URL: "${VITE_PRIVACY_URL:-}"

        # Vite inlines these at build time, so a value that is only in .env and
        # not forwarded here never reaches the bundle. Both links are omitted
        # from the UI when empty rather than rendered pointing nowhere.
        VITE_CONTACT_EMAIL: "${VITE_CONTACT_EMAIL:-}"
        VITE_SUPPORT_URL: "${VITE_SUPPORT_URL:-}"

        # Local testing only. Empty unless `.env` sets it, and `.env` is not
        # tracked. A value here is inlined into the bundle and readable by
        # anyone who loads the page — see `frontend/src/config.ts`.
        VITE_DEV_ACCOUNT_CREDENTIAL: "${VITE_DEV_ACCOUNT_CREDENTIAL:-}"
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    environment:
      # nginx's per-worker connection ceiling, applied by the entrypoint script
      # in the image. The stock 1024 sounds generous and is not: a proxied
      # WebSocket costs two connections, one downstream and one upstream, so it
      # caps this edge at about 512 concurrent conversations per worker — a
      # limit that is reached long before any backend limit and that fails as
      # refused upgrades, which look like a backend fault. `.env.loadtest`
      # raises it for a run with thousands of bots.
      NGINX_WORKER_CONNECTIONS: "${NGINX_WORKER_CONNECTIONS:-1024}"
    ulimits:
      # A file-descriptor limit below the connection limit turns an accept()
      # into EMFILE, which reads as an unexplained refusal rather than a limit.
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      # `development`, even though the image is a production build.
      #
      # This is not about which dependencies are installed — the image already
      # ran `npm ci --omit=dev`. It is about `logger.ts`, which sets
      # `strict: !isProduction`: outside production the message-content denylist
      # **throws** on a forbidden field, and in production it quietly redacts.
      #
      # Redacting is right for a live server — a bad log line must not take down
      # a service. Throwing is right here, because this is where new code is
      # written and a leak of message content into a log line should be
      # impossible to miss. Running the laptop as `production` disarms the
      # loudest safety control in the one place it is most likely to fire.
      #
      # It also governs whether an empty origin allowlist is fatal (R9) and
      # whether TLS to the database is enforced. `docker-compose.prod.yml` sets
      # this back to `production`.
      NODE_ENV: development
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      BACKEND_PORT: "8080"
      BACKEND_HOST: "0.0.0.0"
      # nginx is the only thing in front, so exactly one hop is trusted and the
      # client address is the rightmost entry of X-Forwarded-For (§6.5).
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-1}"
      # The shared secret the backup job presents when it reports a run. Empty
      # means the report route does not exist at all, which is the correct
      # posture for a deployment that is not taking backups — but it also means
      # `BackupMonitor` can never leave `unknown`, so `configWarnings` says so
      # at startup.
      # The price model (D62). Decimal US dollars, converted to micro-cents by
      # `loadConfig` so the whole cost deck shares one unit with persona spend.
      #
      # Zero means **unpriced**, not free — a laptop has no bill, and a
      # plausible default here would be believed and would be wrong.
      # `chat_cost_model_configured` is published beside them so a panel can
      # say so rather than rendering a confident $0.00/hour.
      # Tracing (phase 29). Off by default: this is the one component that adds
      # code to the address space holding every WebSocket file descriptor, and
      # it is the path §18.1 identifies as the likeliest way content leaves the
      # trusted boundary. A deployment not looking at traces should not carry
      # the risk of producing them.
      TRACING_ENABLED: "${TRACING_ENABLED:-false}"
      TRACING_ENDPOINT: "${TRACING_ENDPOINT:-http://tempo:4318}"
      TRACING_SERVICE_NAME: "${TRACING_SERVICE_NAME:-karobakbak-backend}"
      COST_PER_VCPU_HOUR_USD: "${COST_PER_VCPU_HOUR_USD:-0}"
      COST_PER_GB_MEMORY_HOUR_USD: "${COST_PER_GB_MEMORY_HOUR_USD:-0}"
      COST_PER_GB_EGRESS_USD: "${COST_PER_GB_EGRESS_USD:-0}"
      COST_PER_GB_DISK_MONTH_USD: "${COST_PER_GB_DISK_MONTH_USD:-0}"
      BACKUP_REPORT_TOKEN: "${BACKUP_REPORT_TOKEN:-}"
      # An empty allowlist is a startup failure in production (R9). Every entry
      # must match scheme, host *and* port exactly — testing from a phone means
      # adding `http://<lan-ip>:8081`, which is a different origin.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8081}}"
      REDIS_URL: "redis://redis:6379"
      # Fixed, not read from the environment. `postgres` is the compose service
      # name — a fact about this topology, not a deployment variable. Reading it
      # from `.env` looks flexible and is a trap: `.env.example` documents the
      # values for running the backend *outside* Docker, so a `.env` copied from
      # it points the container at `localhost:5432`, where nothing is listening.
      # The failure is quiet — chat keeps working, because retention is
      # write-behind, and only the spool filling up says anything is wrong.
      # Production supplies its own URL through docker-compose.prod.yml.
      DATABASE_URL: "postgres://karobakbak:karobakbak@postgres:5432/karobakbak"
      # Local only. Real deployments require TLS to the database and take their
      # credentials from secret management, never from a compose file (§8.1).
      # Also fixed, for the same reason: the local PostgreSQL container
      # speaks no TLS, and a `.env` copied from `.env.example` carries
      # `DATABASE_REQUIRE_SSL_IN_PRODUCTION=true`, which would stop the stack
      # booting for a reason that has nothing to do with what is being worked
      # on. Production sets both to `true` and means it.
      DATABASE_SSL: "false"
      DATABASE_REQUIRE_SSL_IN_PRODUCTION: "false"
      IP_HASH_SALT: "${IP_HASH_SALT:-local-development-salt-change-me}"
      # Payments. Off unless `.env` says otherwise, and the three credentials
      # have no defaults — `assertCoherent` refuses to start with the flag on
      # and any of them empty, which is the whole point: a default webhook
      # secret means webhooks signed with a public string are accepted.
      #
      # Listed here rather than inherited, like everything else in this block.
      # A var that is only in `.env` is a var the container never sees, and the
      # failure is quiet: the routes simply do not exist and nothing says why.
      # Premium matching preferences (D44, §29). Separate from PAYMENTS_ENABLED
      # on the server: this one turns the scoring on, and the *client* renders a
      # control only when both are true (`FILTERS_AVAILABLE` is derived, not
      # settable). With this on and payments off, every preference is refused
      # `not_premium` — which is the gate being provably closed rather than
      # untested, and is visible in chat_preference_limited_total.
      FILTERS_ENABLED: "${FILTERS_ENABLED:-false}"
      PAYMENTS_ENABLED: "${PAYMENTS_ENABLED:-false}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
      # Sign-in (OIDC, §32, D48). Same rule as the payment block above: listed
      # here or the container never sees it, and the failure is quiet — with
      # AUTH_ENABLED unset the four /auth routes are never registered, so the
      # nginx proxy below returns 404 and it reads as a broken proxy.
      #
      # AUTH_REDIRECT_URI is the origin the BROWSER sees, which is nginx on
      # FRONTEND_PORT, not this container. The backend publishes no host port.
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      AUTH_ISSUER: "${AUTH_ISSUER:-}"
      AUTH_AUTHORIZE_URL: "${AUTH_AUTHORIZE_URL:-}"
      AUTH_TOKEN_URL: "${AUTH_TOKEN_URL:-}"
      AUTH_JWKS_URL: "${AUTH_JWKS_URL:-}"
      AUTH_CLIENT_ID: "${AUTH_CLIENT_ID:-}"
      AUTH_CLIENT_SECRET: "${AUTH_CLIENT_SECRET:-}"
      AUTH_REDIRECT_URI: "${AUTH_REDIRECT_URI:-}"
      AUTH_IDENTITY_PROVIDER: "${AUTH_IDENTITY_PROVIDER:-}"
      AUTH_AVATARS: "${AUTH_AVATARS:-false}"
      AUTH_RETURN_URL: "${AUTH_RETURN_URL:-/}"
      # False only on plain-HTTP localhost, where a Secure cookie is never
      # stored. loadConfig refuses false when NODE_ENV=production.
      AUTH_SECURE_COOKIES: "${AUTH_SECURE_COOKIES:-true}"
      SPOOL_DIR: "/var/lib/karobakbak/spool"
      METRICS_ENABLED: "true"
      # Per-IP abuse controls. Tunable because a load generator is a single
      # address and is exactly the traffic shape these exist to refuse — see
      # `.env.loadtest`. Production keeps the shipped defaults.
      CONN_RATE_LIMIT: "${CONN_RATE_LIMIT:-60}"
      MAX_CONNECTIONS_PER_IP: "${MAX_CONNECTIONS_PER_IP:-40}"
      # Session resumption (§28, D42) and the late-block window (D38).
      #
      # Both ship with defaults `loadConfig` already applies, and both are here
      # because a load run is the only place their cost is visible and the only
      # place anyone will want to change them. A held seat is a session, a match
      # key and a Redis row that outlive their socket, so the grace window sets
      # how much state a population of flapping mobile clients leaves standing.
      #
      # `RESUME_GRACE_SECONDS=0` restores the pre-§28 behaviour, where a dropped
      # socket ended the conversation (D7). That is a supported configuration
      # and the teardown tests run against it — being able to set it from an env
      # file is what makes the before-and-after run possible.
      RESUME_GRACE_SECONDS: "${RESUME_GRACE_SECONDS:-20}"
      BLOCK_LATE_WINDOW_SECONDS: "${BLOCK_LATE_WINDOW_SECONDS:-120}"
      # Moderation policy. Empty by default, which means the deny-list rule
      # never fires and every match is flagged-and-delivered (D20) — the
      # shipped behaviour. `.env.loadtest` fills both in so the load stack
      # exercises the withhold path, which otherwise has no traffic at all.
      MODERATION_DENY_LIST: "${MODERATION_DENY_LIST:-}"
      MODERATION_HARD_BLOCK_RULES: "${MODERATION_HARD_BLOCK_RULES:-}"
    volumes:
      # An **anonymous** volume, one per replica.
      #
      # Every instance needs its own spool: they are separate processes writing
      # separate `spool.jsonl` files, and sharing one would interleave two
      # writers into a single append-only file. A *named* volume cannot do this
      # — replicas of a service share it — so the volume is anonymous and Docker
      # gives each container its own.
      #
      # Never a bind mount to the host either way: the spool holds plaintext
      # message bodies, and a developer's home directory is not where they
      # belong (D28). The volume behind it is where encryption at rest belongs.
      - /var/lib/karobakbak/spool
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # A core dump of this process is a file full of plaintext message bodies —
    # the queue, the spool buffers and every socket's in-flight frame. It is
    # exactly the artefact §2.1 says must not exist outside the boundary, so
    # the kernel is told not to write one.
    ulimits:
      core: 0
    # No published port. The only way in is through nginx.
    expose:
      - "8080"
    # Two on a laptop, one in production. `docker compose up -d --scale
    # backend=N` overrides it for a one-off.
    deploy:
      replicas: 2

  # Migrations run once, as their own step, with credentials that are not the
  # application's (§8.1). The application role has no CREATE, so it could not
  # run these even if something asked it to.
  # --------------------------------------------------------------------------
  # AI personas (docs/AI-PERSONAS.md)
  # --------------------------------------------------------------------------
  # Its own process, for the same reason the console is: it holds a model
  # provider's API key and talks to the internet, and the chat backend holds
  # neither and needs neither. Running them together would put that credential
  # in the address space of the process facing every user's socket.
  #
  # Off by default, and off twice. `PERSONAS_ENABLED` decides whether this
  # process starts at all; `persona_control` in PostgreSQL decides whether
  # anything may join, and it ships disabled. Enabling personas therefore takes
  # a deployment change AND a deliberate, audited act — which is the right
  # weight for a feature that spends money per message.
  #
  # Start it explicitly:  docker compose --profile personas up -d
  personas:
    profiles: ["personas"]
    build:
      context: ./backend
    command: ["node", "dist/personas/main.js"]
    environment:
      # `development` for the same reason the backend uses it: outside
      # production the message-content denylist THROWS rather than redacting,
      # and this process handles message text on its way to a model provider.
      # That is exactly where a leak would be most expensive to discover late.
      NODE_ENV: development
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PERSONAS_ENABLED: "true"

      # Personas connect as ordinary WebSocket clients (D-AI-6), so they go
      # through the same door everybody else does — by service name rather than
      # localhost, because they are in a different container.
      PERSONA_WS_URL: "ws://backend:8080/ws"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8081}}"

      # Empty means no model: personas run on the scripted voice, hold real
      # conversations, exercise the fill policy, the control plane and the
      # console, and spend nothing. That is a supported mode and the right way
      # to see the system work before deciding to pay for it.
      PERSONA_API_KEY: "${PERSONA_API_KEY:-}"

      # The provider and the model are one decision. loadConfig refuses to start
      # on a mismatched pair, because one vendor's model id against the other's
      # key authenticates fine and then fails every call — which the scripted
      # fallback would turn into weeks of unhelpful conversations with nothing
      # in the logs saying why.
      PERSONA_PROVIDER: "${PERSONA_PROVIDER:-anthropic}"
      PERSONA_MODEL: "${PERSONA_MODEL:-claude-haiku-4-5}"

      # Roughly 20 US dollars. Checked before every model call and failing
      # closed, so this is a ceiling rather than an alert (D-AI-7).
      PERSONA_MONTHLY_LIMIT_MICRO_CENTS: "${PERSONA_MONTHLY_LIMIT_MICRO_CENTS:-200000000}"

      # Short locally so a persona turns up while you are still looking at the
      # screen. The default is 25 seconds, which is the right wait for real
      # traffic and far too long for a demo.
      PERSONA_WAIT_BEFORE_FILL_SECONDS: "${PERSONA_WAIT_BEFORE_FILL_SECONDS:-8}"

      # How long a persona waits for a reply before moving on. Zero disables it.
      PERSONA_SILENCE_TIMEOUT_SECONDS: "${PERSONA_SILENCE_TIMEOUT_SECONDS:-120}"
      PERSONA_TICK_INTERVAL_MS: "${PERSONA_TICK_INTERVAL_MS:-2000}"
      PERSONA_MIN_DISPATCH_GAP_MS: "${PERSONA_MIN_DISPATCH_GAP_MS:-6000}"

      # Must stay below MAX_CONNECTIONS_PER_IP: every persona connects from the
      # same address and they share one connection bucket. `assertCoherent`
      # refuses to start if this is violated rather than letting it fail
      # silently as refused connections.
      PERSONA_MAX_CONCURRENT: "${PERSONA_MAX_CONCURRENT:-4}"
      PERSONA_MAX_PER_CHARACTER: "${PERSONA_MAX_PER_CHARACTER:-1}"

      # 0/0 means always active. Production sets a window so personas run when
      # people actually arrive rather than filling an empty 4am.
      PERSONA_ACTIVE_START_HOUR: "${PERSONA_ACTIVE_START_HOUR:-0}"
      PERSONA_ACTIVE_END_HOUR: "${PERSONA_ACTIVE_END_HOUR:-0}"

      IP_HASH_SALT: "${IP_HASH_SALT:-local-development-salt-change-me}"
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgres://karobakbak:karobakbak@postgres:5432/karobakbak"
      DATABASE_SSL: "false"
      DATABASE_REQUIRE_SSL_IN_PRODUCTION: "false"
      # Scraped by Prometheus. Without an endpoint every chat_persona_* series
      # is recorded into a registry nothing can reach, which is the same failure
      # as declaring a metric and never writing it.
      PERSONA_METRICS_PORT: "8090"
    # Overrides the image's healthcheck, which probes :8080 because that is
    # where the chat server listens. This process is not the chat server and has
    # no socket to serve; without the override the container reports unhealthy
    # while working perfectly, which is the kind of false signal that teaches
    # people to ignore health status.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      core: 0

  migrate:
    build:
      context: ./backend
    command: ["node", "-e", "require('./dist/storage/migrate');const{loadConfig}=require('./dist/config');const{createLoggerFromConfig}=require('./dist/logger');const{createDatabase}=require('./dist/storage/pool');const{migrate}=require('./dist/storage/migrate');const c=loadConfig(process.env);const l=createLoggerFromConfig(c);const db=createDatabase(c,l);migrate(db,l).then(r=>{l.info('migrations complete',{applied:r.applied.length,skipped:r.skipped.length});return db.close();}).then(()=>process.exit(0)).catch(e=>{process.stderr.write(String(e&&e.message)+'\\n');process.exit(1);});"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8081}}"
      DATABASE_URL: "postgres://karobakbak:karobakbak@postgres:5432/karobakbak"
      DATABASE_SSL: "false"
      DATABASE_REQUIRE_SSL_IN_PRODUCTION: "false"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    ulimits:
      core: 0

  redis:
    image: redis:7-alpine
    # Persistence off (D12). Live state is reconstructible, and disabling it is
    # what guarantees no Redis structure — including a Pub/Sub payload carrying
    # message text — can reach disk.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Loopback only, so a client on this machine can look inside while nothing
    # on the network can. Production removes this entirely.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-karobakbak}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-karobakbak}"
      POSTGRES_DB: "${POSTGRES_DB:-karobakbak}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    # Loopback only, for DBeaver and psql. It holds plaintext conversation
    # content, so this is a development convenience and nothing more —
    # production removes the mapping and the database is reached through a
    # bastion or a tunnel. 5434 keeps clear of a PostgreSQL installed on the
    # host (5432) and of the integration-test stack (5433).
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # THE THING THAT TAKES BACKUPS
  # ---------------------------------------------------------------------------
  # `BackupMonitor` in the application exists to notice when backups stop. Until
  # now nothing took one, so it reported `unknown` for ever and the alert that
  # watches it could only ever be wrong in one direction or the other.
  #
  # Two secrets, both files rather than environment variables, both gitignored:
  # the passphrase that encrypts the dump, and the token it presents when
  # reporting in. Files because `docker inspect` shows environment variables,
  # and because the passphrase must outlive this host — copy it into a password
  # manager the day you set it.
  backup:
    # ---------------------------------------------------------------------
    # NOT STARTED BY A BARE `docker compose up`
    # ---------------------------------------------------------------------
    # This service needs two operator-provided files, and Docker's answer to a
    # bind mount whose host path does not exist is to **create a directory
    # there**. So without this profile, `docker compose up` on a fresh clone
    # produced a restarting container and two stray directories inside the
    # repository — on a laptop and in the load-test stack, neither of which
    # wants backups at all.
    #
    # `docker compose --profile ops up -d` runs it. Production enables it by
    # resetting this list, so a real deployment gets it without remembering.
    profiles: ["ops"]
    build:
      context: ./ops/backup
    environment:
      PGHOST: postgres
      PGUSER: "${POSTGRES_USER:-karobakbak}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-karobakbak}"
      PGDATABASE: "${POSTGRES_DB:-karobakbak}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_KEEP: "${BACKUP_KEEP:-7}"
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup-passphrase
      # Where the dump goes *after* it is written, as an rclone remote. Unset
      # here because a laptop has nowhere to send one; every run then logs that
      # the backup exists only on this host, which is the honest state.
      #
      # Required in production, where a backup living on the machine it protects
      # is not a backup at all.
      BACKUP_REMOTE: "${BACKUP_REMOTE:-}"
      BACKUP_REPORT_URL: "http://backend:8080/internal/backup-observed"
      BACKUP_REPORT_TOKEN_FILE: /run/secrets/backup-report-token
    volumes:
      - backups:/backups
      # rclone's own configuration — credentials for whatever BACKUP_REMOTE
      # names. Same treatment as the passphrase: a file the operator provides,
      # never an environment variable, because it holds keys to the store
      # containing every retained conversation.
      - ./ops/backup/rclone.conf:/var/lib/backup/rclone/rclone.conf:ro
      - ./ops/backup/passphrase:/run/secrets/backup-passphrase:ro
      - ./ops/backup/report-token:/run/secrets/backup-report-token:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WHERE AN ALERT GOES
  # ---------------------------------------------------------------------------
  # Prometheus decides *that* something is wrong; this decides who hears about
  # it. Without it the rules in `alerts.yml` evaluated and reached nobody, which
  # is the failure mode that looks most like success.
  #
  # The webhook URL is a file rather than an environment variable — Alertmanager
  # does not expand env vars, and a URL that can post alerts as your service is
  # a credential. Copy `webhook-url.example` to `webhook-url` and put yours in
  # it; the real file is gitignored.
  alertmanager:
    # Same reasoning as `backup`: it needs a webhook URL that only an operator
    # can supply, and a missing one would be silently created as a directory.
    # Nothing on a laptop wants to be paged.
    profiles: ["ops"]
    image: prom/alertmanager:v0.28.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertdata:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WHAT THE INFRASTRUCTURE IS DOING, SO THE COST DECK HAS A MULTIPLICAND
  # ---------------------------------------------------------------------------
  # Nine cost categories in the plan and exactly one of them was instrumented
  # (persona LLM spend). These three cover four more: compute, memory, Redis and
  # the database. Egress is counted in the application itself, because that is
  # where the frames already are.
  #
  # All three are read-only observers of things that already exist. None of them
  # is on any request path, so a failed exporter costs a graph and never a
  # conversation.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    # Per-container CPU seconds, memory working set and network bytes — the
    # measurements the compute and memory prices are multiplied by.
    command:
      # Only the metrics the cost rules read. cAdvisor's default set is very
      # large, and most of it is per-filesystem and per-process detail that
      # would triple this Prometheus's series count to answer nothing.
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl"
    volumes:
      # Read-only, and it still sees everything on the host — the same caveat
      # the Alloy socket mount carries. A component to keep pinned and to read
      # the flags of, not inert plumbing.
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8092}:8080"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"
    depends_on:
      - redis
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      # The application's own role, not a superuser. It can read
      # `pg_database_size` and the statistics views, which is all the cost deck
      # asks for, and giving a metrics sidecar more than that would widen the
      # blast radius of a component nothing depends on.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-karobakbak}:${POSTGRES_PASSWORD:-karobakbak}@postgres:5432/${POSTGRES_DB:-karobakbak}?sslmode=disable"
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WHERE LOG LINES GO SO THEY OUTLIVE THE CONTAINER THAT WROTE THEM
  # ---------------------------------------------------------------------------
  # Until this existed, `docker logs` was the whole of it: a 5,000-bot run
  # across two replicas could be watched on a dashboard and the question "what
  # did the server actually say when that happened" had no answer once the
  # container was replaced.
  #
  # Not in the `ops` profile, unlike `backup` and `alertmanager`. Those need an
  # operator-provided secret and have nothing to do on a laptop. This is the
  # opposite: a laptop is exactly where somebody is trying to work out why
  # something behaved oddly, so it comes up with everything else.
  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/loki.yml"]
    user: "root"
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - lokidata:/loki
    ports:
      # Published so a test can query it directly, and bound to loopback like
      # every other component here. Nothing in the application talks to it.
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WHERE SPANS GO
  # ---------------------------------------------------------------------------
  # The third pillar, and the one that arrives with no safety controls of its
  # own. `TRACING_ENABLED` is false by default, so this container is usually
  # running with nothing to receive — which is correct: it costs almost nothing
  # idle, and having it up means turning tracing on is one variable rather than
  # a deploy.
  #
  # 48-hour retention, shorter than Loki's seven days. A trace answers "why was
  # this slow", a question asked within hours. It is not evidence.
  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    user: "root"
    volumes:
      - ./monitoring/tempo:/etc/tempo:ro
      - tempodata:/var/tempo
    ports:
      # 3200 is the query API Grafana reads; 4318 is OTLP/HTTP ingest. Both on
      # loopback, like everything else here.
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${TEMPO_OTLP_PORT:-4318}:4318"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # THE SHIPPER
  # ---------------------------------------------------------------------------
  # Reads container stdout through the Docker API rather than through a logging
  # driver, and the distinction matters on a laptop: the Loki logging driver is
  # a host plugin that sits in the container's start path, so a Loki that is
  # down or slow becomes containers that will not start. This reads from the
  # side and its failure mode is missing logs, which is the right one.
  #
  # `user: root` and the socket mount are what reading that API costs. The
  # socket is mounted read-only, which is not a real boundary — Docker's API is
  # root on the host either way — so this is a component to keep pinned and to
  # read the configuration of, not one to treat as inert plumbing.
  alloy:
    image: grafana/alloy:v1.10.0
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    user: "root"
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  alertdata:
  alloydata:
  lokidata:
  tempodata:
  backups:
  pgdata:
  promdata:
  grafanadata:
